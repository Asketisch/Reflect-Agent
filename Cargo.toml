[workspace]
resolver = "2"
members = [
    # ── protocol ── 底层契约(被所有层依赖)
    "crates/protocol/zhuye-protocol",

    # ── abilities ── 能力原语层
    "crates/abilities/zhuye-llm",
    "crates/abilities/zhuye-tools",
    "crates/abilities/zhuye-bm25",
    "crates/abilities/zhuye-hooks",
    "crates/abilities/zhuye-skills",
    "crates/abilities/zhuye-memory",
    "crates/abilities/zhuye-agent-def",
    "crates/abilities/zhuye-prompt",
    "crates/abilities/zhuye-compact",
    "crates/abilities/zhuye-recovery",
    "crates/abilities/zhuye-notes",
    "crates/abilities/zhuye-sanitize",

    # ── resources ── 配置/权限/插件/可观测性
    "crates/resources/zhuye-config",
    "crates/resources/zhuye-permissions",
    "crates/resources/zhuye-plugin",
    "crates/resources/zhuye-rollout",
    "crates/resources/zhuye-telemetry",
    "crates/resources/zhuye-sandbox",
    "crates/resources/zhuye-ast",

    # ── orchestration ── 多 agent 编排层
    "crates/orchestration/zhuye-subagent",
    "crates/orchestration/zhuye-discussion",
    "crates/orchestration/zhuye-task",
    "crates/orchestration/zhuye-pipeline",
    "crates/orchestration/zhuye-goal",

    # ── integrations ── 外部协议/平台集成
    "crates/integrations/zhuye-mcp",
    "crates/integrations/zhuye-lsp",
    "crates/integrations/zhuye-integration",
    "crates/integrations/zhuye-stream",

    # ── runtime ── 运行时与入口
    # 注:zhuye-tui 已拆分至独立仓库 Reflect-TUI(https://cnb.cool/Demon1019/Reflect-CLI),
    # 核心仓库的 `zhuye` 二进制不再含 TUI 子命令。TUI 二进制由 Reflect-TUI 仓库提供。
    "crates/runtime/zhuye-core",
    "crates/runtime/zhuye-exec",
    "crates/runtime/zhuye-cli",
    "crates/runtime/zhuye",
    "crates/runtime/zhuye-py",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Asketisch/ZhuYe"

[workspace.dependencies]
# ── protocol ── 底层契约
zhuye-protocol = { path = "crates/protocol/zhuye-protocol" }

# ── abilities ── 能力原语层
zhuye-llm        = { path = "crates/abilities/zhuye-llm" }
zhuye-tools      = { path = "crates/abilities/zhuye-tools" }
zhuye-hooks      = { path = "crates/abilities/zhuye-hooks" }
zhuye-skills     = { path = "crates/abilities/zhuye-skills" }
zhuye-memory     = { path = "crates/abilities/zhuye-memory" }
zhuye-agent-def  = { path = "crates/abilities/zhuye-agent-def" }
zhuye-prompt     = { path = "crates/abilities/zhuye-prompt" }
zhuye-compact    = { path = "crates/abilities/zhuye-compact" }
zhuye-recovery   = { path = "crates/abilities/zhuye-recovery" }
zhuye-notes      = { path = "crates/abilities/zhuye-notes" }
zhuye-sanitize   = { path = "crates/abilities/zhuye-sanitize" }

# ── resources ── 配置/权限/插件/可观测性
zhuye-config      = { path = "crates/resources/zhuye-config" }
zhuye-permissions = { path = "crates/resources/zhuye-permissions" }
zhuye-plugin      = { path = "crates/resources/zhuye-plugin" }
zhuye-rollout     = { path = "crates/resources/zhuye-rollout" }
zhuye-telemetry   = { path = "crates/resources/zhuye-telemetry" }
zhuye-sandbox     = { path = "crates/resources/zhuye-sandbox" }
zhuye-ast         = { path = "crates/resources/zhuye-ast" }

# ── orchestration ── 多 agent 编排层
zhuye-subagent    = { path = "crates/orchestration/zhuye-subagent" }
zhuye-discussion  = { path = "crates/orchestration/zhuye-discussion" }
zhuye-task        = { path = "crates/orchestration/zhuye-task" }
zhuye-pipeline    = { path = "crates/orchestration/zhuye-pipeline" }
zhuye-goal        = { path = "crates/orchestration/zhuye-goal" }

# ── integrations ── 外部协议/平台集成
zhuye-mcp         = { path = "crates/integrations/zhuye-mcp" }
zhuye-lsp         = { path = "crates/integrations/zhuye-lsp" }
zhuye-integration = { path = "crates/integrations/zhuye-integration" }
zhuye-stream      = { path = "crates/integrations/zhuye-stream" }

# ── runtime ── 运行时与入口
zhuye-core = { path = "crates/runtime/zhuye-core" }
zhuye-exec = { path = "crates/runtime/zhuye-exec" }
zhuye-cli  = { path = "crates/runtime/zhuye-cli" }
zhuye      = { path = "crates/runtime/zhuye" }
zhuye-py   = { path = "crates/runtime/zhuye-py" }

# 公共外部依赖
tokio              = { version = "1", features = ["full"] }
tokio-util         = "0.7"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
serde_yaml         = "0.9"
toml               = "0.8"
async-trait        = "0.1"
anyhow             = "1"
thiserror          = "1"
tiktoken-rs = "0.12"
clap               = { version = "4", features = ["derive"] }
# S2:TUI 反射 `TaskManager::list_tasks`(async)—— 用 pollster 在 sync 上下文
# block_on,免去给整个 App 套 tokio runtime。pollster 无依赖、~200 LOC。
pollster           = "0.4"
# pyo3 ≥ 0.27 才正式支持 Python 3.14 final(0.25/0.26 仅支持 3.14 beta);
# 0.30 进一步支持 3.15,MSRV 1.85 与本仓库一致。旧版 0.23 在 CI runner
# 默认 Python 3.14 下构建失败(pyo3-ffi build.rs 硬校验版本上限)。
pyo3               = "0.30"
reqwest            = { version = "0.12", features = ["json", "stream", "gzip", "rustls-tls"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures            = "0.3"

# MCP (v0.3+)
rmcp               = { version = "=1.7.0", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }

# LSP (v0.5) — 只取类型,JSON-RPC peer 自己在 `zhuye-lsp/transport.rs` 手写
# (对齐项目风格:mock_mcp_server 也是自己手写 JSON-RPC)。
lsp-types         = { version = "=0.97", default-features = false }
globset           = "0.4"
url               = "2"

# 协议
schemars = "0.8"
uuid     = { version = "1", features = ["v4", "v7", "serde"] }

# LLM
eventsource-stream = "0.2"

# 工具
walkdir = "2"
ignore  = "0.4"
similar = "2"
regex   = "1"
rankfns = "0.1"
zhuye-bm25 = { path = "crates/abilities/zhuye-bm25" }
# v1.0.0-rc4: `web_fetch` builtin —— HTML 转 Markdown。
htmd        = "0.5"
# 通用 lazy container(`WebSearchTool` 等延迟初始化的场景)。
once_cell   = "1"

# Prompt 构建
minijinja = "2"

# Rollout 回放
chrono = { version = "0.4", features = ["serde"] }

# 记忆(M4 可能切换到 rusqlite)
sled = "0.34"

# 并发原语
parking_lot = "0.12"
# v1.0.0-rc3:`read_before_edit` hook 测试可控 mtime 漂移。
filetime    = "0.2"

# v1.3 analytics 遥测:OTLP/HTTP 导出 + tracing bridge
opentelemetry         = "0.27"
opentelemetry_sdk     = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp    = { version = "0.27", features = ["http-proto", "reqwest-client", "trace"] }
tracing-opentelemetry = "0.28"

# 测试(M1)
wiremock = "0.6"
insta    = { version = "1", features = ["yaml"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# 快速开发 profile:无 LTO,高并行度。
# 本地迭代用;发布分发时切换到 `release`。
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 2
incremental = true

# ── dev profile ─────────────────────────────────────────
# 关掉 incremental:cargo 不会 GC `target/debug/incremental/`,
# 不开 incremental 模式下该目录根本不会生成,长期占用可控。
# 代价是首次 cargo build 略慢(同源码改动重编依赖关系需重计算),
# 但收益是 `make gc` 不再是刚需、磁盘不再无界膨胀。
# debug 字段保持默认(=2 完整变量名信息),TUI 单步调试体验不受影响。
[profile.dev]
incremental = false

# ── test profile ──────────────────────────────────────
# 加速测试二进制编译(测试通常无需单步调试)。
[profile.test]
debug = 1            # 仅行号信息,减小测试产物体积、加速编译与链接
codegen-units = 256  # 高并行度(cargo 默认值,显式声明便于后续调优)
