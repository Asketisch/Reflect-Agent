[project]
name = "zhuye"
version = "0.1.3"
description = "ZhuYe Agent SDK for Python: spawn `zhuye serve` and drive it over JSONL stdio."
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "ZhuYe Contributors" }]
# 无运行时依赖:仅 stdlib(os / subprocess / threading / json / dataclasses)。
dependencies = []

[project.urls]
Homepage = "https://github.com/Asketisch/ZhuYe"
Repository = "https://github.com/Asketisch/ZhuYe"
Issues = "https://github.com/Asketisch/ZhuYe/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

# 平台 wheel:bindings=bin 要求 manifest 有个 bin target,maturin 才肯
# 构建 —— 用最小 stub 满足形式;真正的平台二进制由 CI 编译 zhuye-cli
# 后拷入 zhuye/bin/(python-source 内,自动成为包数据,单份携带),
# 运行时经 zhuye.agent._bundled_binary 解析。避免 manifest 直指
# zhuye-cli:maturin 会把 cargo 产物再装一份到 venv scripts(双份携带,
# 且默认 debug 构建)。
[tool.maturin]
bindings = "bin"
manifest-path = "bindings-stub/Cargo.toml"
python-source = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
