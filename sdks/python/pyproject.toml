[project]
name = "zhuye"
version = "0.1.0"
description = "ZhuYe Agent SDK for Python: spawn `zhuye serve` and drive it over JSONL stdio."
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "ZhuYe Contributors" }]
# 无运行时依赖:仅 stdlib(os / subprocess / threading / json / dataclasses)。
dependencies = []

[project.urls]
Homepage = "https://github.com/Asketisch/ZhuYe"
Repository = "https://github.com/Asketisch/ZhuYe"
Issues = "https://github.com/Asketisch/ZhuYe/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zhuye*"]

[tool.setuptools.package-data]
zhuye = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"