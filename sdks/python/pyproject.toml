[project]
name = "reflect-agent"
version = "0.1.0"
description = "Reflect Agent SDK for Python: spawn `reflect serve` and drive it over JSONL stdio."
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "Reflect Agent Contributors" }]
# 无运行时依赖:仅 stdlib(os / subprocess / threading / json / dataclasses)。
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reflect*"]

[tool.setuptools.package-data]
reflect = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"