[package]
name = "reflect-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reflect: MCP (Model Context Protocol) client integration"

[dependencies]
reflect-protocol  = { workspace = true }
reflect-tools     = { workspace = true }
reflect-config    = { workspace = true }
rmcp             = { workspace = true }
tokio            = { workspace = true }
tokio-util       = { workspace = true }
# rmcp 1.7 自己锁了 reqwest 0.13.x(workspace reqwest 是 0.12),这里单独声明
# 与 rmcp 内部 StreamableHttpClient 的 `reqwest::Client` 同 crate 版本。
reqwest          = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde            = { workspace = true }
serde_json       = { workspace = true }
async-trait      = { workspace = true }
thiserror        = { workspace = true }
tracing          = { workspace = true }
parking_lot      = { workspace = true }
uuid             = { workspace = true }
futures          = { workspace = true }

[dev-dependencies]
tempfile = "3"

# 测试用 mock stdio MCP server 子进程:`CARGO_BIN_EXE_mock_mcp_server` 在编译期
# 由 cargo 注入绝对路径,测试 `cargo test -p reflect-exec --test mcp_integration`
# 把它作为子进程拉起。
[[bin]]
name = "mock_mcp_server"
path = "src/bin/mock_mcp_server.rs"
required-features = []  # 测试需要,但生产构建不依赖
