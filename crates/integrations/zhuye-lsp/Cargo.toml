[package]
name = "zhuye-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZhuYe: LSP (Language Server Protocol) client integration"

[dependencies]
zhuye-protocol = { workspace = true }
zhuye-tools    = { workspace = true }
zhuye-config   = { workspace = true }
# lsp-types 只取数据类型,JSON-RPC peer 在 transport.rs 手写。
# default-features = false 防止它带入不必要的依赖(usvg/reqwest 等)。
lsp-types        = { workspace = true, default-features = false }
tokio            = { workspace = true }
tokio-util       = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
async-trait      = { workspace = true }
thiserror        = { workspace = true }
tracing          = { workspace = true }
parking_lot      = { workspace = true }
globset          = { workspace = true }
url              = { workspace = true }

[dev-dependencies]
tempfile = "3"

# 测试用 mock stdio LSP server:集成测试通过 workspace 路径推算定位 binary。
# `cargo build` 时先构建 `zhuye-lsp`,集成测试运行前 `mock_lsp_server` 已就绪。
[[bin]]
name = "mock_lsp_server"
path = "src/bin/mock_lsp_server.rs"
required-features = []
