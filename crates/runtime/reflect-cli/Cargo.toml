reflect-plugin     = { workspace = true }
reflect-protocol   = { workspace = true }
reflect-task       = { workspace = true }
reflect-pipeline   = { workspace = true }
reflect-subagent   = { workspace = true }
reflect-tools      = { workspace = true }
reflect-llm        = { workspace = true }
reflect-telemetry  = { workspace = true }
anyhow         = { workspace = true }
clap           = { workspace = true }
tokio          = { workspace = true }
tokio-util     = { workspace = true }
toml           = { workspace = true }
serde_json     = { workspace = true }
uuid           = { workspace = true }
tracing        = { workspace = true }

[dev-dependencies]
tempfile = "3"
wiremock = { workspace = true }
