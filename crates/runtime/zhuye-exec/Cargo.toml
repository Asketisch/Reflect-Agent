[package]
name = "zhuye-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZhuYe: headless executable (JSONL Event stream)"
# v0.4 起,顶层 `zhuye` 二进制通过 `zhuye_exec::run` 进程内转发 —— 关掉
# `src/main.rs` 的 implicit binary,使其不再作为独立 binary 编译。
autobins = false

[lib]
name = "zhuye_exec"
path = "src/lib.rs"

# v0.4 起,`zhuye-exec` 二进制由顶层 `zhuye` 路由进程内转发,
# 此处不再声明 [[bin]]。`src/main.rs` 保留作为 archaeology,
# 不再编译为可执行文件 —— 所有调用走 `zhuye_exec::run`。

[features]
default = []
# v1.4 D1:真实分词器(直通 zhuye-compact/tokenizer)。开启后启动期
# 注册 tiktoken 估算器,压缩触发 / 上下文余量计算用精确计数。
tokenizer = ["zhuye-compact/tokenizer"]

[dependencies]
zhuye-core      = { workspace = true }
zhuye-llm       = { workspace = true }
zhuye-protocol  = { workspace = true }
zhuye-tools     = { workspace = true }
zhuye-compact   = { workspace = true }
zhuye-memory    = { workspace = true }
zhuye-skills    = { workspace = true }
zhuye-agent-def = { workspace = true }
zhuye-prompt    = { workspace = true }
zhuye-rollout   = { workspace = true }
zhuye-telemetry = { workspace = true }
zhuye-subagent  = { workspace = true }
zhuye-config    = { workspace = true }
zhuye-notes     = { workspace = true }
zhuye-recovery  = { workspace = true }
zhuye-hooks     = { workspace = true }
zhuye-mcp       = { workspace = true }
zhuye-lsp       = { workspace = true }
zhuye-ast       = { workspace = true }
zhuye-task      = { workspace = true }
zhuye-plugin    = { workspace = true }
zhuye-permissions = { workspace = true }
zhuye-stream      = { workspace = true }
anyhow              = { workspace = true }
async-trait         = { workspace = true }
chrono              = { workspace = true }
clap                = { workspace = true }
parking_lot         = { workspace = true }
serde_json          = { workspace = true }
tokio               = { workspace = true }
tokio-util          = { workspace = true }
tracing                = { workspace = true }
tracing-subscriber     = { workspace = true }
# v1.3 analytics 遥测:init_tracing 里挂 OpenTelemetryLayer
opentelemetry         = { workspace = true }
opentelemetry_sdk     = { workspace = true }
tracing-opentelemetry = { workspace = true }
uuid                   = { workspace = true }

[dev-dependencies]
tempfile  = "3"
tokio     = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
async-trait = { workspace = true }
futures     = { workspace = true }
parking_lot = { workspace = true }
zhuye-sandbox  = { workspace = true }
zhuye-mcp      = { workspace = true }
zhuye-plugin   = { workspace = true }
zhuye-tools    = { workspace = true }
zhuye-llm      = { workspace = true }

# v0.4 起,`mock_mcp_server` 二进制仅由 `zhuye-mcp` crate 声明;
# `zhuye-exec` 集成测试通过 workspace 路径推算定位该 binary。
# cargo 在 build zhuye-exec 时会先 build zhuye-mcp(dependency),
# 所以 `target/{debug,release}/mock_mcp_server` 总在 test 运行前就生成。
